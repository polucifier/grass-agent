<h1>v.clean</h1>
<p>Toolset for cleaning topology of vector map.</p>
<h2>DESCRIPTION</h2>
<p>The <em>v.clean</em> module cleans vector topology.</p>
<h2>NOTES</h2>
<p>The rmdupl tool removes duplicate geometry features.</p>
<h2>EXAMPLES</h2>
<pre>
v.clean input=roads output=roads_clean tool=rmdupl
</pre>
